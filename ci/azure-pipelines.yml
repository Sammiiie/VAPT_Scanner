# Azure DevOps pipeline step. Install the "SARIF SAST Scans Tab" extension to see results in the build UI.
trigger:
  branches:
    include: [ main ]

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 8.0.x

  # Installs the published tool from nuget.org. If the scanner source is vendored in your repo instead,
  # build it with: dotnet build tools/VAPT_Scanner/src/VaptScanner -c Release -o $(Agent.TempDirectory)/vapt
  # and call dotnet $(Agent.TempDirectory)/vapt/vapt.dll with --exclude "tools/VAPT_Scanner/**".
  - script: dotnet tool install --tool-path $(Agent.TempDirectory)/vapt VaptScanner
    displayName: Install VAPT scanner

  - script: >
      $(Agent.TempDirectory)/vapt/vapt scan $(Build.SourcesDirectory)
      --format console,sarif,html
      --out $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs
      --fail-on High
    displayName: Security scan (release gate)

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs
      ArtifactName: CodeAnalysisLogs   # this name is what the SARIF tab looks for
